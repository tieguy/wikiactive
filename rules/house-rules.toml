# House rules — mechanically enforced product decisions (not Wikipedia policy).
# The compiled constants in src/lib.rs (USER_AGENT, DISCLOSURE_SUFFIX) are what
# the code enforces; this file mirrors them for maintainers and is kept in
# exact sync by tests/integrations.rs::house_rules_match_compiled_constants.

[zai]
# The model driver's endpoint (plan-003 B.0: this fork's key is a
# Coding-Plan key — its quota lives on the coding endpoint; the standard
# api.z.ai/api/paas/v4 base returns "no resource package" for it).
# ZAI_API_KEY comes from the environment (never config); ZAI_BASE_URL
# still overrides this for one-off runs.
base_url = "https://api.z.ai/api/coding/paas/v4"
# The model called at the three judgment points (also recorded in
# disclosure entries as the drafting model).
model = "glm-5.3"

[disclosure]
# Appended to every published edit summary. Format checked by tests/publish.rs.
suffix = "LLM-Disclosure: [[User:LuisVilla/wikiactive]]"
# Page on en.wikipedia maintained as the full disclosure artifact.
page = "User:LuisVilla/wikiactive"
# Subpage carrying the per-article-session log entries.
log_page = "User:LuisVilla/wikiactive/log"
# Drafting model recorded in session-log entries (the disclosed assistant).
drafting_model = "glm-5.3"
# Refuse to publish a summary that lacks the suffix (never append silently to
# an operator-provided summary that tried to omit it).
require_suffix = true

[prose]
# House rule: no semicolons in drafted prose (mirrored in linter.toml).
ban_semicolons = true

[operator]
# The on-wiki operator identity (single fork-edit point alongside
# user_agent.string and the disclosure block). Default for
# `wa session init --review-since-user` drift review.
username = "LuisVilla"

[citevar]
named_refs = true
ban_autonumber_refnames = ":N pattern"
ban_templates = ["sfn"]
pinpoint_template = "rp"

[user_agent]
# Must identify the operator (docs/api-etiquette.md). Asserted by tests/integrations.rs.
string = "wikiactive/0.1 (en.wikipedia User:LuisVilla; luis@lu.is)"

[etiquette]
maxlag_seconds = 5
backoff_on = [429, 503]
respect_retry_after = true
assert_user_on_edit = true
